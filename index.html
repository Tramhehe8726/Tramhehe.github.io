<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>LỚP 12 TOÁN 2</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

/* NỀN */

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#eaf6ff,#cfe9ff);
overflow:hidden;
}

/* MÂY */

.cloud{
position:absolute;
background:white;
border-radius:50px;
opacity:0.7;
animation:cloudMove 40s linear infinite;
}

.cloud:before,
.cloud:after{
content:"";
position:absolute;
background:white;
border-radius:50%;
}

.cloud:before{
width:60px;
height:60px;
top:-20px;
left:10px;
}

.cloud:after{
width:80px;
height:80px;
top:-35px;
right:10px;
}

.c1{width:160px;height:50px;top:15%;left:-200px;}
.c2{width:200px;height:60px;top:35%;left:-250px;animation-duration:60s;}
.c3{width:140px;height:45px;top:65%;left:-180px;animation-duration:50s;}

@keyframes cloudMove{
from{transform:translateX(0);}
to{transform:translateX(120vw);}
}

/* BONG BÓNG */

.bubble{
position:absolute;
bottom:-100px;
background:rgba(255,255,255,0.3);
border-radius:50%;
animation:bubbleUp 12s infinite;
}

.b1{width:30px;height:30px;left:20%;}
.b2{width:40px;height:40px;left:50%;animation-duration:10s;}
.b3{width:25px;height:25px;left:70%;animation-duration:14s;}

@keyframes bubbleUp{
from{
transform:translateY(0);
opacity:0.5;
}
to{
transform:translateY(-120vh);
opacity:0;
}
}

/* KHUNG */

.container{
position:relative;
text-align:center;
padding:70px 100px;

background:white;

border-radius:25px;

box-shadow:0 20px 50px rgba(0,0,0,0.15);

animation:fadeIn 1.2s ease;
}

/* ANIMATION */

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

/* TITLE */

h1{
font-size:42px;
color:#1e3a8a;
line-height:1.6;
}

/* TÊN LỚP */

h1 span{
display:block;
font-size:55px;
font-weight:bold;
color:#2563eb;
letter-spacing:3px;
margin-top:10px;
}

/* ICON */

.icons{
font-size:28px;
margin-top:20px;
}

/* BUTTON */

.enter-btn{
display:inline-block;
margin-top:30px;

padding:12px 35px;

border-radius:40px;

background:linear-gradient(45deg,#3b82f6,#2563eb);

color:white;

font-weight:bold;

text-decoration:none;

transition:0.3s;

box-shadow:0 8px 20px rgba(0,0,0,0.2);
}

.enter-btn:hover{
transform:scale(1.1);
box-shadow:0 12px 30px rgba(0,0,0,0.3);
}

</style>
</head>

<body>

<!-- mây -->
<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div class="cloud c3"></div>

<!-- bong bóng -->
<div class="bubble b1"></div>
<div class="bubble b2"></div>
<div class="bubble b3"></div>

<div class="container">

<h1>
Chào mừng đến với
<span>LỚP 12 TOÁN 2</span>
</h1>

<div class="icons">
📘 ✏️ 📐 🎓
</div>

<a href="menu1.html" class="enter-btn">
Vào lớp học 🚀
</a>

</div>

</body>
</html>
