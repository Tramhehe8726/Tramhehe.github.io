<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Toán 2 - K34</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#667eea,#764ba2);
overflow: hidden; /* Ngăn cuộn trang */
cursor: pointer; /* Con trỏ bàn tay */
}

/* khung chính */

.wrapper{
width:750px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
border-radius:20px;
padding:40px;
box-shadow:0 10px 40px rgba(0,0,0,0.2);
position: relative;
z-index: 10;
pointer-events: none; /* Cho click xuyên qua */
}

/* tiêu đề */

.header{
text-align:center;
margin-bottom:40px;
}

.title{
font-size:32px;
font-weight:bold;
color:white;
letter-spacing:2px;
text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
}

/* menu */

.menu1{
display:flex;
justify-content:space-between;
gap:40px;
}

.col{
flex:1;
display:flex;
flex-direction:column;
gap:20px;
}

/* nút */

.pill{
display:block;
text-align:center;
padding:14px;
border-radius:40px;
text-decoration:none;
font-weight:bold;
color:white;
background:linear-gradient(45deg,#ff9a9e,#fad0c4);
transition:all 0.3s ease;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
pointer-events: auto; /* Nút vẫn click được */
}

.pill:nth-child(2){
background:linear-gradient(45deg,#a18cd1,#fbc2eb);
}

.pill:nth-child(3){
background:linear-gradient(45deg,#84fab0,#8fd3f4);
}

.pill:hover{
transform:translateY(-5px) scale(1.05);
box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

/* BONG BÓNG NHỎ KHI CLICK */
.click-bubble {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.8);
    pointer-events: none;
    transform: translate(-50%, -50%);
    animation: bubble-rise 2.5s ease-out forwards;
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.6), inset -3px -3px 8px rgba(255,255,255,0.7);
    z-index: 1000;
}

/* Hiệu ứng bong bóng nhỏ bay lên */
@keyframes bubble-rise {
    0% {
        width: 0;
        height: 0;
        opacity: 0.9;
        transform: translate(-50%, -50%);
    }
    15% {
        width: 30px;
        height: 30px;
        opacity: 0.8;
        transform: translate(-50%, -50%);
    }
    50% {
        width: 25px;
        height: 25px;
        opacity: 0.6;
        transform: translate(calc(-50% + 20px), calc(-50% - 120px));
    }
    80% {
        width: 15px;
        height: 15px;
        opacity: 0.3;
        transform: translate(calc(-50% + 30px), calc(-50% - 220px));
    }
    100% {
        width: 8px;
        height: 8px;
        opacity: 0;
        transform: translate(calc(-50% + 40px), calc(-50% - 300px));
    }
}

/* Hiệu ứng bong bóng nhỏ bay chậm hơn */
@keyframes bubble-slow {
    0% {
        width: 0;
        height: 0;
        opacity: 0.9;
        transform: translate(-50%, -50%);
    }
    20% {
        width: 25px;
        height: 25px;
        opacity: 0.8;
        transform: translate(-50%, -50%);
    }
    60% {
        width: 20px;
        height: 20px;
        opacity: 0.5;
        transform: translate(calc(-50% - 15px), calc(-50% - 150px));
    }
    100% {
        width: 10px;
        height: 10px;
        opacity: 0;
        transform: translate(calc(-50% - 25px), calc(-50% - 280px));
    }
}

/* Hiệu ứng gợn sóng nhỏ */
.ripple-small {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,0.7) 0%, rgba(255,255,255,0) 80%);
    pointer-events: none;
    transform: translate(-50%, -50%);
    animation: ripple-small 1s ease-out forwards;
    z-index: 999;
}

@keyframes ripple-small {
    0% {
        width: 0;
        height: 0;
        opacity: 0.5;
    }
    100% {
        width: 80px;
        height: 80px;
        opacity: 0;
    }
}

/* responsive */

@media(max-width:700px){
.menu1{
flex-direction:column;
}
.wrapper{
width:90%;
padding:30px;
}
}

</style>
</head>

<body>

<div class="wrapper">

<div class="header">
<div class="title">Toán 2 - K34 - Hét ra lửa mửa ra khói ói ra than</div>
</div>

<div class="menu1">

<div class="col">
<a href="gioithieu.html" class="pill">📘 Giới thiệu chung</a>
<a href="sodolop2.html" class="pill">🪑 Sơ đồ lớp</a>
<a href="danhsachlop.html" class="pill">📋 Danh sách lớp</a>
<a href="kiniem.html" class="pill">📸 Kỉ niệm</a>
<a href="thanhtich.html" class="pill">🏆 Thành tích</a>
</div>

</div>

</div>

<script>
// Hiệu ứng bong bóng nhỏ khi click chuột
document.addEventListener('click', function(e) {
    // Tạo gợn sóng nhỏ
    createSmallRipple(e.clientX, e.clientY);
    
    // Tạo nhiều bong bóng nhỏ (8-15 bong bóng)
    const bubbleCount = 8 + Math.floor(Math.random() * 8);
    
    for (let i = 0; i < bubbleCount; i++) {
        setTimeout(() => {
            createSmallBubble(e.clientX, e.clientY);
        }, i * 40); // Mỗi bong bóng cách nhau 40ms
    }
});

function createSmallRipple(x, y) {
    const ripple = document.createElement('div');
    ripple.classList.add('ripple-small');
    ripple.style.left = x + 'px';
    ripple.style.top = y + 'px';
    document.body.appendChild(ripple);
    
    setTimeout(() => {
        ripple.remove();
    }, 1000);
}

function createSmallBubble(x, y) {
    const bubble = document.createElement('div');
    
    // Random animation (70% bay nhanh, 30% bay chậm)
    if (Math.random() < 0.3) {
        bubble.classList.add('click-bubble');
        bubble.style.animation = 'bubble-slow 3s ease-out forwards';
    } else {
        bubble.classList.add('click-bubble');
        bubble.style.animation = 'bubble-rise 2.2s ease-out forwards';
    }
    
    // Kích thước nhỏ (8-35px)
    const size = 8 + Math.floor(Math.random() * 27);
    
    // Mảng màu pastel nhẹ nhàng
    const colors = [
        'rgba(255, 255, 255, 0.9)',  // trắng trong
        'rgba(200, 230, 255, 0.8)',  // xanh nhạt
        'rgba(255, 220, 240, 0.8)',  // hồng nhạt
        'rgba(220, 255, 220, 0.8)',  // xanh lá nhạt
        'rgba(255, 255, 200, 0.7)',  // vàng nhạt
        'rgba(230, 210, 255, 0.8)',  // tím nhạt
        'rgba(255, 235, 215, 0.8)'   // cam nhạt
    ];
    
    const randomColor = colors[Math.floor(Math.random() * colors.length)];
    
    // Random độ lệch nhẹ
    const offsetX = (Math.random() - 0.5) * 50;
    const offsetY = (Math.random() - 0.5) * 30;
    
    bubble.style.width = size + 'px';
    bubble.style.height = size + 'px';
    bubble.style.left = (x + offsetX) + 'px';
    bubble.style.top = (y + offsetY) + 'px';
    bubble.style.background = `radial-gradient(circle at 35% 35%, white, ${randomColor})`;
    bubble.style.border = '1px solid rgba(255,255,255,0.4)';
    
    document.body.appendChild(bubble);
    
    setTimeout(() => {
        bubble.remove();
    }, 3000);
}

// Xử lý riêng cho các nút
document.querySelectorAll('.pill').forEach(button => {
    button.addEventListener('click', function(e) {
        e.stopPropagation();
        
        // Tạo hiệu ứng nhẹ
        createSmallRipple(e.clientX, e.clientY);
        
        // Tạo ít bong bóng hơn
        for (let i = 0; i < 5; i++) {
            setTimeout(() => {
                createSmallBubble(e.clientX, e.clientY);
            }, i * 50);
        }
        
        // Chuyển trang sau 150ms
        setTimeout(() => {
            window.location.href = button.getAttribute('href');
        }, 150);
        
        e.preventDefault();
    });
});

// Hiệu ứng chào mừng khi load trang (bong bóng nhẹ nhàng)
window.addEventListener('load', function() {
    for (let i = 0; i < 10; i++) {
        setTimeout(() => {
            const x = Math.random() * window.innerWidth;
            const y = Math.random() * window.innerHeight;
            createSmallBubble(x, y);
        }, i * 100);
    }
});

// Click vào tiêu đề tạo nhiều bong bóng
document.querySelector('.header').addEventListener('click', function(e) {
    e.stopPropagation();
    
    for (let i = 0; i < 12; i++) {
        setTimeout(() => {
            const x = e.clientX + (Math.random() - 0.5) * 150;
            const y = e.clientY + (Math.random() - 0.5) * 100;
            createSmallBubble(x, y);
        }, i * 30);
    }
    
    createSmallRipple(e.clientX, e.clientY);
    createSmallRipple(e.clientX - 30, e.clientY - 30);
    createSmallRipple(e.clientX + 30, e.clientY + 30);
});
</script>

</body>
</html>
