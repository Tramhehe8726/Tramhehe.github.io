<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>LỚP 12 TOÁN 2</title>

<style>

/* ================= ROOT ================= */

:root{
--main-blue:#2563eb;
--deep-blue:#1e3a8a;
--soft-blue:#eaf6ff;
--light:#ffffff;
--shadow:0 20px 50px rgba(0,0,0,0.15);
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

/* ================= NỀN ================= */

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(135deg,#eaf6ff,#cfe9ff,#dff3ff);
background-size:400% 400%;

animation:bgMove 12s ease infinite;

overflow:hidden;
cursor:pointer;
}

@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

/* ================= MÂY ================= */

.cloud{
position:absolute;
background:white;
border-radius:50px;
opacity:.75;
animation:cloudMove linear infinite;
filter:blur(.3px);
}

.cloud::before,
.cloud::after{
content:"";
position:absolute;
background:white;
border-radius:50%;
}

.cloud::before{
width:60px;
height:60px;
top:-20px;
left:10px;
}

.cloud::after{
width:80px;
height:80px;
top:-35px;
right:10px;
}

.c1{width:160px;height:50px;top:15%;left:-200px;animation-duration:40s;}
.c2{width:200px;height:60px;top:35%;left:-250px;animation-duration:60s;}
.c3{width:140px;height:45px;top:65%;left:-180px;animation-duration:50s;}

@keyframes cloudMove{
from{transform:translateX(0)}
to{transform:translateX(120vw)}
}

/* ================= BUBBLE FLOAT ================= */

.bubble{
position:absolute;
bottom:-100px;
border-radius:50%;
background:rgba(255,255,255,.35);
backdrop-filter:blur(2px);
animation:bubbleUp infinite;
}

.b1{width:30px;height:30px;left:20%;animation-duration:12s;}
.b2{width:40px;height:40px;left:50%;animation-duration:10s;}
.b3{width:25px;height:25px;left:70%;animation-duration:14s;}

@keyframes bubbleUp{
from{
transform:translateY(0);
opacity:.6;
}
to{
transform:translateY(-120vh);
opacity:0;
}
}

/* ================= CONTAINER ================= */

.container{
position:relative;
text-align:center;

padding:70px 100px;

background:rgba(255,255,255,.9);
backdrop-filter:blur(10px);

border-radius:25px;

box-shadow:var(--shadow);

animation:fadeIn 1.2s ease;

z-index:10;

pointer-events:none;
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(40px) scale(.95);
}
to{
opacity:1;
transform:translateY(0) scale(1);
}
}

/* ================= TITLE ================= */

h1{
font-size:42px;
color:var(--deep-blue);
line-height:1.6;
text-shadow:0 2px 10px rgba(0,0,0,.05);
}

h1 span{
display:block;
font-size:55px;
font-weight:bold;
color:var(--main-blue);
letter-spacing:4px;
margin-top:10px;

animation:glow 3s ease-in-out infinite;
}

@keyframes glow{
0%,100%{text-shadow:0 0 5px rgba(37,99,235,.3)}
50%{text-shadow:0 0 20px rgba(37,99,235,.6)}
}

/* ================= ICON ================= */

.icons{
font-size:30px;
margin-top:20px;
letter-spacing:6px;
animation:floatIcon 4s ease-in-out infinite;
}

@keyframes floatIcon{
0%,100%{transform:translateY(0)}
50%{transform:translateY(-6px)}
}

/* ================= BUTTON ================= */

.enter-btn{

display:inline-block;
margin-top:30px;

padding:13px 38px;

border-radius:40px;

background:linear-gradient(45deg,#3b82f6,#2563eb);

color:white;

font-weight:bold;

text-decoration:none;

box-shadow:0 8px 20px rgba(0,0,0,.2);

transition:.35s;

pointer-events:auto;
}

.enter-btn:hover{
transform:translateY(-3px) scale(1.08);
box-shadow:0 12px 30px rgba(0,0,0,.3);
}

/* ================= CLICK EFFECT ================= */

.click-bubble{
position:absolute;
border-radius:50%;
pointer-events:none;

transform:translate(-50%,-50%);

animation:bubble-pop 2.5s ease-out forwards;

box-shadow:0 0 12px rgba(255,255,255,.8);

z-index:1000;
}

@keyframes bubble-pop{

0%{
width:0;
height:0;
opacity:.8;
transform:translate(-50%,-50%) scale(0);
}

30%{
width:40px;
height:40px;
opacity:.7;
transform:translate(-50%,-50%) scale(1.1);
}

70%{
width:30px;
height:30px;
opacity:.4;
transform:translate(calc(-50% + 15px),calc(-50% - 60px)) scale(.8);
}

100%{
width:20px;
height:20px;
opacity:0;
transform:translate(calc(-50% + 30px),calc(-50% - 120px)) scale(.4);
}

}

.ripple-effect{
position:absolute;

border-radius:50%;

background:radial-gradient(circle,rgba(255,255,255,.8) 0%,rgba(255,255,255,0) 70%);

pointer-events:none;

transform:translate(-50%,-50%);

animation:ripple .8s ease-out forwards;

z-index:999;
}

@keyframes ripple{
0%{
width:0;
height:0;
opacity:.5;
}
100%{
width:80px;
height:80px;
opacity:0;
}
}

</style>
</head>

<body>

<div class="cloud c1"></div>
<div class="cloud c2"></div>
<div class="cloud c3"></div>

<div class="bubble b1"></div>
<div class="bubble b2"></div>
<div class="bubble b3"></div>

<div class="container">

<h1>
Chào mừng đến với
<span>LỚP 12 TOÁN 2</span>
</h1>

<div class="icons">
📘 ✏️ 📐 🎓
</div>

<a href="menu1.html" class="enter-btn">
Vào lớp học 🚀
</a>

</div>

<script>

const colors=[
'rgba(135,206,250,0.7)',
'rgba(255,182,193,0.7)',
'rgba(152,251,152,0.7)',
'rgba(255,255,0,0.5)',
'rgba(255,255,255,0.8)',
'rgba(218,112,214,0.6)',
'rgba(255,218,185,0.7)'
];

document.addEventListener("click",e=>{

createRipple(e.clientX,e.clientY)

let bubbleCount=8+Math.floor(Math.random()*10)

for(let i=0;i<bubbleCount;i++){

setTimeout(()=>{
createBubble(e.clientX,e.clientY)
},i*40)

}

})

function createRipple(x,y){

let ripple=document.createElement("div")
ripple.className="ripple-effect"

ripple.style.left=x+"px"
ripple.style.top=y+"px"

document.body.appendChild(ripple)

setTimeout(()=>ripple.remove(),800)

}

function createBubble(x,y){

let bubble=document.createElement("div")
bubble.className="click-bubble"

let size=10+Math.random()*25
let color=colors[Math.floor(Math.random()*colors.length)]

let offsetX=(Math.random()-0.5)*25
let offsetY=(Math.random()-0.5)*25

bubble.style.width=size+"px"
bubble.style.height=size+"px"

bubble.style.left=(x+offsetX)+"px"
bubble.style.top=(y+offsetY)+"px"

bubble.style.background=`radial-gradient(circle at 30% 30%, white, ${color})`

document.body.appendChild(bubble)

setTimeout(()=>bubble.remove(),2500)

}

document.querySelector(".enter-btn").addEventListener("click",e=>{

e.stopPropagation()

createRipple(e.clientX,e.clientY)

for(let i=0;i<8;i++){

setTimeout(()=>{
createBubble(e.clientX,e.clientY)
},i*40)

}

})

</script>

</body>
</html>
