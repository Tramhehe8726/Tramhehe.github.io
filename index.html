<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>LỚP 12 TOÁN 2</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

/* nền xanh dương nhạt */

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(135deg,#e8f3ff,#cfe8ff);
}

/* container */

.container{

text-align:center;
padding:60px 90px;

border-radius:25px;

background:white;

box-shadow:0 15px 40px rgba(0,0,0,0.15);

animation:fadeIn 1.2s ease;
}

/* animation */

@keyframes fadeIn{

from{
opacity:0;
transform:translateY(40px);
}

to{
opacity:1;
transform:translateY(0);
}

}

/* title */

h1{

color:#1e3a8a;
font-size:40px;
line-height:1.6;

}

/* highlight */

h1 span{

display:block;

margin-top:10px;

font-size:50px;

font-weight:bold;

color:#2563eb;

letter-spacing:3px;

}

/* hover effect */

.container:hover{

transform:scale(1.03);
transition:0.3s;

}

</style>
</head>

<body>

<div class="container">

<a href="menu1.html" style="text-decoration:none;">

<h1>
Chào mừng đến với<br>
<span>LỚP 12 TOÁN 2</span>
</h1>

</a>

</div>

</body>
</html>
