body{
    margin:0;

    background:linear-gradient(135deg,#fff6f9,#ffeef5);
}

/* HEADER */

.wrapper{
    width:95%;
    margin:auto;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px;
}

.title{
    font-size:22px;
    font-weight:bold;
    color:#ff4f87;
}

.page-btn{
    text-decoration:none;
    background:#ff4f87;
    color:white;
    padding:8px 16px;
    border-radius:20px;
}

/* GRID */

.section-title{
    text-align:center;
    margin-top:10px;
    color:#444;
}

.memory-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
    padding:20px;
}

.memory-card{
    background:white;
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,0.1);
    transition:0.3s;
}

.memory-card:hover{
    transform:translateY(-6px) scale(1.02);
}

.memory-card img{
    width:100%;
    cursor:pointer;
}

.memory-card video{
    width:100%;
    display:block;
    cursor:pointer;
}

.memory-content{
    padding:12px;
}

/* LIGHTBOX */

.lightbox{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,0.8);
    backdrop-filter:blur(3px);
}

.lightbox-img{
    max-width:80%;
    max-height:80%;
    border-radius:10px;
    animation:zoom 0.4s ease;
}

.lightbox-video{
    max-width:80%;
    max-height:80%;
    border-radius:10px;
    animation:zoom 0.4s ease;
}

@keyframes zoom{
    from{transform:scale(0.6)}
    to{transform:scale(1)}
}

.close{
    position:absolute;
    top:20px;
    right:30px;
    font-size:40px;
    color:white;
    cursor:pointer;
}

/* HEART + FLOWER */

.effect{
    position:fixed;
    font-size:20px;
    pointer-events:none;
    animation:floatUp 2.5s linear forwards;
}

<script>

const mediaItems = document.querySelectorAll(".memory-card img, .memory-card video");
const lightbox = document.getElementById("lightbox");
const lightboxImg = document.getElementById("lightbox-img");
const lightboxVideo = document.getElementById("lightbox-video");
const closeBtn = document.querySelector(".close");

/* OPEN MEDIA + HEART FLOWER */

mediaItems.forEach(media=>{
media.onclick=()=>{
lightbox.style.display="flex";

if(media.tagName==="VIDEO"){
const videoSrc = media.currentSrc || media.querySelector("source")?.src || media.src;
lightboxImg.style.display="none";
lightboxVideo.style.display="block";
lightboxVideo.src=videoSrc;
lightboxVideo.play();
}else{
lightboxVideo.pause();
lightboxVideo.removeAttribute("src");
lightboxVideo.load();
lightboxVideo.style.display="none";
lightboxImg.style.display="block";
lightboxImg.src=media.src;
}

createLoveExplosion();
};
});

function closeLightbox(){
lightbox.style.display="none";
lightboxVideo.pause();
lightboxVideo.removeAttribute("src");
lightboxVideo.load();
}

closeBtn.onclick=()=>closeLightbox();

lightbox.onclick=e=>{
if(e.target===lightbox){
closeLightbox();
}
}

/* HEART FLOWER EFFECT */

function createLoveExplosion(){

const icons=["💖","🌸","💗","🌺","💘"];

for(let i=0;i<25;i++){

let el=document.createElement("div");
el.className="effect";
el.innerText=icons[Math.floor(Math.random()*icons.length)];

el.style.left=Math.random()*window.innerWidth+"px";
el.style.top=(window.innerHeight/2)+"px";

document.body.appendChild(el);

setTimeout(()=>el.remove(),2500);

}

}
