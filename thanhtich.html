<!-- Card 1 - Học tập -->
<div class="achievement-card">
    <div class="card-image" id="img10-1">
        <div class="image-placeholder">
            <i class="fas fa-graduation-cap"></i>
            <span>Ảnh hoạt động học tập</span>
        </div>
        <img src="" alt="Học tập lớp 10" onclick="openModal(this, 'img10-1')">
        <!-- Thư viện ảnh sẽ được thêm vào đây -->
        <div class="image-gallery"></div>
    </div>
    <div class="card-content">
        <div class="card-icon">🏆</div>
        <h3>Học tập xuất sắc</h3>
        <p><i class="fas fa-check-circle"></i> 1 huy chương vàng cờ vua<br>
           <i class="fas fa-check-circle"></i> học sinh đạt giải HSG cấp trường<br>
           <i class="fas fa-check-circle"></i> học sinh đạt giải HSG cấp tỉnh môn toán<br>
           <i class="fas fa-check-circle"></i> học sinh đạt giải HSG cấp tỉnh môn sinh</p>
        <span class="badge">Thành tích nổi bật</span><br>
        
        <!-- Ô nhập mô tả cho ảnh -->
        <div class="caption-input">
            <input type="text" id="caption-img10-1" placeholder="Nhập mô tả cho ảnh..." value="Hoạt động học tập lớp 10">
        </div>
        
        <!-- Upload 1 ảnh -->
        <label for="upload10-1" class="upload-btn"><i class="fas fa-upload"></i> Thêm ảnh</label>
        <input type="file" id="upload10-1" accept="image/*" onchange="previewImage(this, 'img10-1')">
        
        <!-- Upload nhiều ảnh -->
        <label for="multi-upload10-1" class="add-more-btn">
            <i class="fas fa-images"></i> Thêm nhiều ảnh
        </label>
        <input type="file" id="multi-upload10-1" class="multi-upload" accept="image/*" multiple onchange="uploadMultipleImages(this, 'img10-1')">
    </div>
</div>.
