<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Toán 2 - K34</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI, sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(135deg,#667eea,#764ba2);
}

/* khung chính */

.wrapper{
width:750px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(10px);
border-radius:20px;
padding:40px;
box-shadow:0 10px 40px rgba(0,0,0,0.2);
}

/* tiêu đề */

.header{
text-align:center;
margin-bottom:40px;
}

.title{
font-size:32px;
font-weight:bold;
color:white;
letter-spacing:2px;
}

/* menu */

.menu{
display:flex;
justify-content:space-between;
gap:40px;
}

.col{
flex:1;
display:flex;
flex-direction:column;
gap:20px;
}

/* nút */

.pill{
display:block;
text-align:center;
padding:14px;
border-radius:40px;
text-decoration:none;
font-weight:bold;
color:white;
background:linear-gradient(45deg,#ff9a9e,#fad0c4);
transition:all 0.3s ease;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

.pill:nth-child(2){
background:linear-gradient(45deg,#a18cd1,#fbc2eb);
}

.pill:nth-child(3){
background:linear-gradient(45deg,#84fab0,#8fd3f4);
}

.pill:hover{
transform:translateY(-5px) scale(1.05);
box-shadow:0 10px 20px rgba(0,0,0,0.3);
}

/* CSS để tạo hình dáng bóng bóng */
  
.bubble {
    position: absolute;
    border-radius: 50%;
    background: rgba(135, 206, 250, 0.6); /* Màu xanh nhạt trong suốt */
    pointer-events: none; /* Tránh việc bóng bóng cản trở các cú click khác */
    transform: translate(-50%, -50%);
    animation: blow-up 1s ease-out forwards;
    box-shadow: inset -5px -5px 10px rgba(255, 255, 255, 0.4);
}

/* Hiệu ứng bong bóng bay lên và mờ dần */
@keyframes blow-up {
    0% {
        width: 0;
        height: 0;
        opacity: 1;
    }
    100% {
        width: 100px;
        height: 100px;
        opacity: 0;
        margin-top: -100px; /* Bay lên trên */
    }
}
/* responsive */

@media(max-width:700px){

.menu{
flex-direction:column;
}

}

</style>
</head>

<body>

<div class="header">
