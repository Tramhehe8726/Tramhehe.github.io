<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Toán 2 - K34</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:"Segoe UI",sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(270deg,#667eea,#764ba2,#6dd5ed,#a18cd1);
background-size:600% 600%;
animation:bgMove 12s ease infinite;
overflow:hidden;
cursor:pointer;
}

/* nền chuyển động */

@keyframes bgMove{
0%{background-position:0% 50%}
50%{background-position:100% 50%}
100%{background-position:0% 50%}
}

/* khung kính */

.wrapper{
width:750px;
background:rgba(255,255,255,0.15);
backdrop-filter:blur(15px);
border-radius:25px;
padding:40px;
box-shadow:0 15px 50px rgba(0,0,0,0.3);
position:relative;
z-index:10;
pointer-events:none;
border:1px solid rgba(255,255,255,0.2);
}

/* tiêu đề */

.header{
text-align:center;
margin-bottom:40px;
}

.title{
font-size:34px;
font-weight:bold;
color:white;
letter-spacing:2px;
text-shadow:0 0 10px rgba(255,255,255,0.7),
             0 0 20px rgba(255,255,255,0.4);
animation:titleGlow 3s infinite alternate;
}

@keyframes titleGlow{
from{filter:brightness(1)}
to{filter:brightness(1.3)}
}

/* menu */

.menu1{
display:flex;
justify-content:center;
gap:40px;
}

.col{
flex:1;
display:flex;
flex-direction:column;
gap:20px;
}

/* nút */

.pill{
display:block;
text-align:center;
padding:14px;
border-radius:40px;
text-decoration:none;
font-weight:bold;
color:white;
background:linear-gradient(45deg,#ff9a9e,#fad0c4);
transition:all 0.3s ease;
box-shadow:0 6px 20px rgba(0,0,0,0.25);
pointer-events:auto;
position:relative;
overflow:hidden;
}

.pill:nth-child(2){
background:linear-gradient(45deg,#a18cd1,#fbc2eb);
}

.pill:nth-child(3){
background:linear-gradient(45deg,#84fab0,#8fd3f4);
}

.pill:nth-child(4){
background:linear-gradient(45deg,#ffecd2,#fcb69f);
}

.pill:nth-child(5){
background:linear-gradient(45deg,#cfd9df,#e2ebf0);
color:#333;
}

.pill:hover{
transform:translateY(-6px) scale(1.07);
box-shadow:0 10px 30px rgba(0,0,0,0.35);
}

/* ripple */

.pill::after{
content:"";
position:absolute;
width:0;
height:0;
background:rgba(255,255,255,0.4);
border-radius:50%;
transform:translate(-50%,-50%);
left:50%;
top:50%;
opacity:0;
transition:0.6s;
}

.pill:active::after{
width:200px;
height:200px;
opacity:0;
transition:0s;
}

/* bong bóng click */

.small-bubble{
position:absolute;
border-radius:50%;
pointer-events:none;
transform:translate(-50%,-50%);
animation:floatUp 2.5s ease-out forwards;
box-shadow:0 0 10px rgba(255,255,255,0.6);
z-index:1000;
}

@keyframes floatUp{

0%{
opacity:0.9;
transform:translate(-50%,-50%) scale(0.2);
}

50%{
opacity:0.8;
}

100%{
opacity:0;
transform:translate(calc(-50% + 20px),calc(-50% - 180px)) scale(1);
}

}

/* bong bóng nền */

.bgBubble{
position:absolute;
bottom:-100px;
border-radius:50%;
background:rgba(255,255,255,0.08);
animation:rise 15s linear infinite;
}

@keyframes rise{
from{
transform:translateY(0);
}
to{
transform:translateY(-120vh);
}
}

/* responsive */

@media(max-width:700px){

.menu1{
flex-direction:column;
}

.wrapper{
width:90%;
padding:30px;
}

}

</style>
</head>

<body>

<div class="wrapper">

<div class="header">
<div class="title">TOÁN 2 - K34 - HÉT RA LỬA MỬA RA KHÓI ÓI RA THAN</div>
</div>

<div class="menu1">

<div class="col">
<a href="gioithieu.html" class="pill">📘 Giới thiệu chung</a>
<a href="sodolop2.html" class="pill">🪑 Sơ đồ lớp</a>
<a href="danhsachlop.html" class="pill">📋 Danh sách lớp</a>
<a href="kiniem.html" class="pill">📸 Kỉ niệm</a>
<a href="thanhtich.html" class="pill">🏆 Thành tích</a>
<a href="trochoi.html" class="pill">🎮Game</a>
</div>

</div>

</div>

<script>

/* bong bóng click */

document.addEventListener('click',function(e){

const count=3+Math.floor(Math.random()*5);

for(let i=0;i<count;i++){

setTimeout(()=>{
createBubble(e.clientX,e.clientY);
},i*60)

}

})

function createBubble(x,y){

const b=document.createElement("div")
b.className="small-bubble"

const size=12+Math.random()*18

const colors=[
"rgba(255,182,193,0.8)",
"rgba(173,216,230,0.8)",
"rgba(255,255,224,0.8)",
"rgba(221,160,221,0.8)",
"rgba(144,238,144,0.8)"
]

b.style.width=size+"px"
b.style.height=size+"px"

b.style.left=(x+(Math.random()-0.5)*30)+"px"
b.style.top=(y+(Math.random()-0.5)*20)+"px"

b.style.background=colors[Math.floor(Math.random()*colors.length)]

document.body.appendChild(b)

setTimeout(()=>b.remove(),2500)

}

/* bong bóng nền */

function backgroundBubbles(){

for(let i=0;i<15;i++){

const b=document.createElement("div")
b.className="bgBubble"

const size=20+Math.random()*60

b.style.width=size+"px"
b.style.height=size+"px"

b.style.left=Math.random()*100+"vw"

b.style.animationDuration=10+Math.random()*15+"s"

document.body.appendChild(b)

}

}

backgroundBubbles()

</script>

</body>
</html>
