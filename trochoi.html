<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Game Tìm 2 Ảnh Giống Nhau</title>

<style>

body{
font-family: Arial;
background: linear-gradient(135deg,#d4f1ff,#a8e6ff);
text-align:center;
color:#0a3d62;
overflow-x:hidden;
}

h1{
margin-top:10px;
}

.game-board{
width:720px;
margin:auto;
display:grid;
grid-template-columns: repeat(4,1fr);
gap:15px;
margin-top:30px;
}

.card{
width:150px;
height:150px;
background:#ffffff;
border-radius:10px;
cursor:pointer;
position:relative;
transform-style: preserve-3d;
transition: transform 0.5s;
box-shadow:0 5px 10px rgba(0,0,0,0.15);
}

.card.flip{
transform: rotateY(180deg);
}

.front, .back{
position:absolute;
width:100%;
height:100%;
border-radius:10px;
backface-visibility:hidden;
}

.front{
background:#e3f6ff;
}

.back{
transform: rotateY(180deg);
}

.back img{
width:100%;
height:100%;
border-radius:10px;
object-fit:cover;
}

.matched{
visibility:hidden;
}

button{
padding:10px 20px;
font-size:18px;
border:none;
border-radius:6px;
cursor:pointer;
margin-top:20px;
}

#restart{
background:#4fc3f7;
color:white;
}

#home{
position:absolute;
right:20px;
top:20px;
background:#29b6f6;
color:white;
}

#win{
display:none;
font-size:40px;
margin-top:20px;
animation: win 1s infinite alternate;
}

@keyframes win{
from{transform:scale(1)}
to{transform:scale(1.2)}
}

/* Bong bóng */

.bubble{
position:fixed;
border-radius:50%;
pointer-events:none;
animation: bubbleFloat 2s linear forwards;
}

@keyframes bubbleFloat{
0%{
transform:translateY(0) scale(1);
opacity:1;
}
100%{
transform:translateY(-120px) scale(1.5);
opacity:0;
}
}

</style>
</head>

<body>

<button id="home" onclick="window.location.href='index.html'">Trang chủ</button>

<h1>Game Lật Thẻ Tìm Ảnh Giống Nhau</h1>

<div id="win">🎉 Bạn đã thắng! 🎉</div>

<div class="game-board" id="board"></div>

<button id="restart">Chơi lại</button>

<!-- Âm thanh -->
<audio id="flipSound" src="https://assets.mixkit.co/sfx/preview/mixkit-game-click-1114.mp3"></audio>
<audio id="winSound" src="https://assets.mixkit.co/sfx/preview/mixkit-winning-chimes-2015.mp3"></audio>

<!-- Nhạc nền -->
<audio id="bgMusic" autoplay loop>
<source src="https://assets.mixkit.co/music/preview/mixkit-game-level-music-689.mp3">
</audio>

<script>

const images=[
"choicuoi11.jpeg",
"m.quan.jpg",
"mthu.jpg",
"Chi.jpg",
"Cuong.jpg",
"GKhanh.jpg",
"Minh.JPG",
"Tuan.jpg"
];

let cards=[...images,...images];

cards.sort(()=>0.5-Math.random());

const board=document.getElementById("board");

let firstCard=null;
let secondCard=null;
let lock=false;
let matched=0;

cards.forEach(img=>{

const card=document.createElement("div");
card.classList.add("card");

card.innerHTML=`
<div class="front"></div>
<div class="back">
<img src="${img}">
</div>
`;

card.dataset.image=img;

card.addEventListener("click",flipCard);

board.appendChild(card);

});

function flipCard(){

if(lock) return;
if(this===firstCard) return;

document.getElementById("flipSound").play();

this.classList.add("flip");

if(!firstCard){
firstCard=this;
return;
}

secondCard=this;

checkMatch();

}

function checkMatch(){

if(firstCard.dataset.image===secondCard.dataset.image){

firstCard.classList.add("matched");
secondCard.classList.add("matched");

matched++;

reset();

if(matched===8){

document.getElementById("win").style.display="block";
document.getElementById("winSound").play();

}

}else{

lock=true;

setTimeout(()=>{

firstCard.classList.remove("flip");
secondCard.classList.remove("flip");

reset();

},1000)

}

}

function reset(){

[firstCard,secondCard]=[null,null];
lock=false;

}

document.getElementById("restart").onclick=()=>{
location.reload();
}

/* Hiệu ứng bong bóng khi click */

document.addEventListener("click",function(e){

for(let i=0;i<6;i++){

const bubble=document.createElement("div");

bubble.className="bubble";

const size=Math.random()*20+10;

bubble.style.width=size+"px";
bubble.style.height=size+"px";

bubble.style.left=(e.clientX+(Math.random()*40-20))+"px";
bubble.style.top=(e.clientY+(Math.random()*40-20))+"px";

bubble.style.background="rgba(120,200,255,0.6)";

document.body.appendChild(bubble);

setTimeout(()=>{
bubble.remove();
},2000)

}

});

</script>

</body>
</html>
