<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Game Lật Thẻ</title>

<style>

body{
font-family:Arial;
text-align:center;
background:linear-gradient(135deg,#6dd5ed,#2193b0);
margin:0;
}

h1{
margin-top:20px;
color:white;
}

#homeBtn{
position:absolute;
top:10px;
right:10px;
padding:10px 15px;
background:#ff5252;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

#restart{
margin-top:20px;
padding:10px 20px;
font-size:18px;
background:#4CAF50;
color:white;
border:none;
border-radius:8px;
cursor:pointer;
}

.grid{
width:540px;
margin:30px auto;
display:grid;
grid-template-columns:repeat(4,120px);
gap:15px;
}

.card{
width:120px;
height:120px;
position:relative;
transform-style:preserve-3d;
transition:transform .5s;
cursor:pointer;
}

.card.flip{
transform:rotateY(180deg);
}

.front,.back{
position:absolute;
width:100%;
height:100%;
border-radius:10px;
backface-visibility:hidden;
}

.front{
background:#333;
}

.back{
transform:rotateY(180deg);
}

.back img{
width:100%;
height:100%;
border-radius:10px;
}

.win{
font-size:40px;
color:white;
display:none;
}

</style>
</head>

<body>

<button id="homeBtn" onclick="goHome()">🏠 Trang chủ</button>

<h1>Game Tìm 2 Hình Giống Nhau</h1>

<div class="grid" id="game"></div>

<button id="restart">🔄 Chơi lại</button>

<div class="win" id="winText">🎉 BẠN ĐÃ THẮNG 🎉</div>

<!-- Âm thanh -->
<audio id="flipSound" src="https://www.soundjay.com/buttons/button-16.mp3"></audio>

<!-- Nhạc nền -->
<audio id="bgMusic" autoplay loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_3a2f4b27a3.mp3">
</audio>

<script>

const images=[
"https://picsum.photos/id/1015/200",
"https://picsum.photos/id/1025/200",
"https://picsum.photos/id/1035/200",
"https://picsum.photos/id/1045/200",
"https://picsum.photos/id/1055/200",
"https://picsum.photos/id/1065/200",
"https://picsum.photos/id/1075/200",
"https://picsum.photos/id/1084/200"
];

let cards=[...images,...images];

let firstCard=null;
let secondCard=null;
let lock=false;
let matched=0;

const game=document.getElementById("game");

function shuffle(array){
return array.sort(()=>Math.random()-0.5);
}

function createBoard(){

game.innerHTML="";
matched=0;

document.getElementById("winText").style.display="none";

shuffle(cards);

cards.forEach(img=>{

const card=document.createElement("div");
card.classList.add("card");
card.dataset.image=img;

card.innerHTML=`

<div class="front"></div>

<div class="back">
<img src="${img}">
</div>

`;

card.addEventListener("click",flipCard);

game.appendChild(card);

});

}

function flipCard(){

if(lock) return;
if(this===firstCard) return;

document.getElementById("flipSound").play();

this.classList.add("flip");

if(!firstCard){
firstCard=this;
return;
}

secondCard=this;

checkMatch();

}

function checkMatch(){

let match=firstCard.dataset.image===secondCard.dataset.image;

if(match){

setTimeout(()=>{

firstCard.style.visibility="hidden";
secondCard.style.visibility="hidden";

matched++;

if(matched===8){
winGame();
}

reset();

},500);

}else{

lock=true;

setTimeout(()=>{

firstCard.classList.remove("flip");
secondCard.classList.remove("flip");

reset();

},1000);

}

}

function reset(){

firstCard=null;
secondCard=null;
lock=false;

}

function winGame(){

const win=document.getElementById("winText");

win.style.display="block";

win.animate([

{transform:"scale(1)"},

{transform:"scale(1.3)"},

{transform:"scale(1)"}

],{

duration:800,

iterations:4

});

}

document.getElementById("restart").onclick=createBoard;

function goHome(){
window.location.href="index.html";
}

createBoard();

</script>

</body>
</html>
