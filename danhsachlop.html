<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Danh sách lớp 12 Toán 2</title>

<style>

body{
font-family:Arial;
margin:0;
background:linear-gradient(180deg,#dff4ff,#f7fcff);
overflow-x:hidden;
}

.wrapper{
width:90%;
max-width:1100px;
margin:auto;
padding:30px;
position:relative;
z-index:2;
}

.header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
}

.title{
font-size:26px;
font-weight:bold;
color:#0077b6;
}

.page-btn{
text-decoration:none;
padding:10px 18px;
background:#4cc9f0;
color:white;
border-radius:8px;
transition:0.3s;
}

.page-btn:hover{
background:#0096c7;
}

h2{
text-align:center;
margin-bottom:25px;
color:#005f86;
}

.search-box{
display:flex;
justify-content:center;
margin-bottom:25px;
}

.search-box input{
width:300px;
padding:10px 15px;
border-radius:20px;
border:2px solid #90e0ef;
outline:none;
font-size:16px;
}

.student-table{
width:100%;
border-collapse:collapse;
background:white;
border-radius:10px;
overflow:hidden;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

.student-table th{
background:#90e0ef;
padding:12px;
color:#003049;
}

.student-table td{
padding:10px;
text-align:center;
border-bottom:1px solid #eee;
}

.student-table tr:hover{
background:#f1fbff;
}

/* tên học sinh có thể click */

.student-name{
cursor:pointer;
color:#0077b6;
font-weight:500;
}

.student-name:hover{
text-decoration:underline;
}

/* popup ảnh */

.image-popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.6);
display:flex;
align-items:center;
justify-content:center;
opacity:0;
pointer-events:none;
transition:0.3s;
z-index:10;
}

.image-popup img{
max-width:300px;
border-radius:12px;
box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

.image-popup.show{
opacity:1;
pointer-events:auto;
}

/* bong bóng nền */

.bubble-bg{
position:fixed;
bottom:-100px;
width:20px;
height:20px;
background:rgba(173,232,244,0.5);
border-radius:50%;
animation:floatUp linear infinite;
}

@keyframes floatUp{
from{
transform:translateY(0);
opacity:1;
}
to{
transform:translateY(-110vh);
opacity:0;
}
}

/* bong bóng click */

.click-bubble{
position:absolute;
width:15px;
height:15px;
background:#48cae4;
border-radius:50%;
pointer-events:none;
animation:pop 1s forwards;
}

@keyframes pop{
0%{
transform:scale(0.5);
opacity:1;
}
100%{
transform:translateY(-80px) scale(1.5);
opacity:0;
}
}

</style>
</head>

<body>

<div class="wrapper">

<div class="header">
<div class="title"> 12 TOÁN 2 - K34 </div>
<a href="menu1.html" class="page-btn">Trang chủ</a>
</div>

<h2>DANH SÁCH LỚP 12 TOÁN 2</h2>

<div class="search-box">
<input type="text" id="searchInput" placeholder="🔍 Tìm kiếm học sinh...">
</div>

<table class="student-table" id="studentTable">

<thead>
<tr>
<th>STT</th>
<th>Họ và tên</th>
<th>Giới tính</th>
<th>Chức vụ</th>
<th>Ngày sinh</th>
</tr>
</thead>

<tbody>

<tr><td>1</td><td class="student-name" data-img="img/ATu.ipg">Đỗ Thế Bình</td><td>Nam</td><td>Học viên</td><td>28/09/2008</td></tr>
<tr><td>2</td><td class="student-name" data-img="img/chau.jpg">Nguyễn Bảo Châu</td><td>Nữ</td><td>Học viên</td><td>10/09/2008</td></tr>
<tr><td>3</td><td class="student-name" data-img="img/chi.jpg">Đoàn Ngân Chi</td><td>Nữ</td><td>Học viên</td><td>23/10/2008</td></tr>
<tr><td>4</td><td class="student-name" data-img="img/cuong.jpg">Đặng Minh Cường</td><td>Nam</td><td>Học viên</td><td>28/10/2008</td></tr>

</tbody>
</table>

</div>

<!-- popup ảnh -->

<div class="image-popup" id="imagePopup">
<img id="studentImg">
</div>

<script>

/* tìm kiếm học sinh */

document.getElementById("searchInput").addEventListener("keyup",function(){
let filter=this.value.toLowerCase();
let rows=document.querySelectorAll("#studentTable tbody tr");

rows.forEach(row=>{
let name=row.cells[1].textContent.toLowerCase();
row.style.display=name.includes(filter)?"":"none";
});
});

/* click tên hiện ảnh */

let names=document.querySelectorAll(".student-name");
let popup=document.getElementById("imagePopup");
let img=document.getElementById("studentImg");

names.forEach(name=>{
name.addEventListener("click",function(e){

e.stopPropagation();

let src=this.getAttribute("data-img");
img.src=src;

popup.classList.add("show");

});
});

/* click nền để tắt ảnh */

popup.addEventListener("click",()=>{
popup.classList.remove("show");
});

/* bong bóng click */

document.addEventListener("click",function(e){

let bubble=document.createElement("div");
bubble.className="click-bubble";

bubble.style.left=e.pageX+"px";
bubble.style.top=e.pageY+"px";

document.body.appendChild(bubble);

setTimeout(()=>{
bubble.remove();
},1000);

});

/* bong bóng bay nền */

function createBackgroundBubble(){

let bubble=document.createElement("div");
bubble.className="bubble-bg";

bubble.style.left=Math.random()*100+"vw";
bubble.style.width=bubble.style.height=(10+Math.random()*25)+"px";
bubble.style.animationDuration=(6+Math.random()*8)+"s";

document.body.appendChild(bubble);

setTimeout(()=>{
bubble.remove();
},14000);

}

setInterval(createBackgroundBubble,800);

</script>

</body>
</html>
